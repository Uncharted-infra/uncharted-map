[project]
name = "uncharted-flights-sidecar"
version = "0.1.0"
description = "FastAPI wrapper for fast-flights (Google Flights scraper)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "fast-flights>=2.0.0",
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
